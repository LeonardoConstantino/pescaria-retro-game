<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Golden Fish Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Water Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Moon / Glow in Sky -->
  <circle cx="370" cy="140" r="54" fill="#fef08a" fill-opacity="0.25" filter="url(#glow)" />
  <circle cx="370" cy="140" r="36" fill="#fef08a" fill-opacity="0.6" />

  <!-- Stars -->
  <circle cx="120" cy="110" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="210" cy="80" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="150" cy="180" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="440" cy="220" r="3" fill="#ffffff" opacity="0.5" />

  <!-- Waves Back Layer -->
  <path d="M0,370 C90,340 170,390 260,360 C350,330 430,370 512,350 L512,512 L0,512 Z" fill="#0369a1" opacity="0.8" />

  <!-- Leaping Golden Fish -->
  <g transform="translate(110, 130) scale(0.95)" filter="url(#glow)">
    <!-- Fish Body Curve -->
    <path d="M 60,190 C 70,120 150,50 240,80 C 290,95 320,140 310,180 C 280,210 200,230 130,220 C 90,215 70,205 60,190 Z" fill="url(#goldGrad)" />

    <!-- Tail Fins -->
    <path d="M 65,190 C 30,160 10,140 0,160 C 20,190 30,200 10,230 C 30,225 50,210 65,190 Z" fill="#d97706" />

    <!-- Dorsal Fin -->
    <path d="M 180,60 C 220,40 260,55 270,85 C 240,80 205,75 180,60 Z" fill="#f59e0b" />

    <!-- Pectoral Fin -->
    <path d="M 200,160 C 220,180 240,200 230,210 C 210,205 195,185 200,160 Z" fill="#fbbf24" />

    <!-- Fish Eye -->
    <circle cx="280" cy="130" r="9" fill="#ffffff" />
    <circle cx="282" cy="130" r="5" fill="#0f172a" />
    <circle cx="284" cy="128" r="2" fill="#ffffff" />

    <!-- Fish Scales Pattern Highlight -->
    <path d="M 170,120 Q 185,135 170,150" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 200,110 Q 215,125 200,140" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
    <path d="M 225,125 Q 240,140 225,155" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Fishing Line and Hook -->
  <path d="M 370,0 C 350,110 370,170 380,240 C 385,270 365,290 350,285" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6,3" opacity="0.85" />
  <!-- Hook -->
  <path d="M 350,285 C 340,280 330,295 340,310 C 352,325 375,315 370,295" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />

  <!-- Water Splashes / Droplets -->
  <circle cx="160" cy="330" r="8" fill="#e0f2fe" opacity="0.9" />
  <circle cx="140" cy="310" r="5" fill="#bae6fd" opacity="0.8" />
  <circle cx="340" cy="340" r="7" fill="#e0f2fe" opacity="0.9" />
  <circle cx="365" cy="325" r="4.5" fill="#bae6fd" opacity="0.8" />

  <!-- Waves Front Layer -->
  <path d="M0,400 C80,375 160,420 250,395 C340,370 420,410 512,390 L512,512 L0,512 Z" fill="url(#waveGrad)" />

  <!-- Sparkles -->
  <polygon points="170,100 174,110 184,114 174,118 170,128 166,118 156,114 166,110" fill="#fef08a" opacity="0.9" />
  <polygon points="340,80 343,87 350,90 343,93 340,100 337,93 330,90 337,87" fill="#ffffff" opacity="0.85" />
</svg>
